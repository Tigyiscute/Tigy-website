<input type="text" oninput="pushKey(this.value.slice(-1)); this.value=''">
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
<script>
    const db = firebase.initializeApp({ databaseURL: "YOUR_FIREBASE_URL" }).database();
    function pushKey(k) { db.ref('lastkey').set({ val: k, ts: Date.now() }); }
</script>
